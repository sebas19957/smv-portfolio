name: CI

# main and portfolio-v3 are verified by docker-publish.yml, which calls this workflow before
# publishing; a push trigger for them here would run the same checks twice.
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
  # Reused as the verify gate of the Docker publish workflow.
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Check, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Version comes from the `packageManager` field in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # Same exact Node version as the Dockerfile (package.json engines require >= 22.23.4).
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Test
        run: pnpm test

      # Secrets are read at runtime only, so the build needs no environment variables.
      - name: Build
        run: pnpm build
