name: CI

on:
  push:
    branches: [portfolio-v3, develop]
  pull_request:
    branches: [develop, main]
  # Reused as the verify gate of the Docker publish workflow.
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Check, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Version comes from the `packageManager` field in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      # Same exact Node version as the Dockerfile (package.json engines require >= 22.23.4).
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Test
        run: pnpm test

      # Secrets are read at runtime only, so the build needs no environment variables.
      - name: Build
        run: pnpm build
